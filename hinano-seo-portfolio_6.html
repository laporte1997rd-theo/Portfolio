  document.getElementById("toTop").textContent = t(UI.top);
  document.getElementById("footSub").textContent = t(C.foot);
  document.getElementById("brandMain").textContent = LANG==="ja" ? "瀬尾 ひなの" : "Hinano Seo";
  document.getElementById("brandSub").textContent  = LANG==="ja" ? "Hinano Seo" : "瀬尾ひなの";
  document.getElementById("navlinks").innerHTML = C.nav.map(function(n){return '<li><a href="#'+n[0]+'">'+esc(t(n[1]))+'</a></li>';}).join("");

  var h="";

  /* hero */
  var nameMain = LANG==="ja" ? "瀬尾 ひなの" : "Hinano Seo";
  var nameSub  = LANG==="ja" ? "Hinano Seo" : "瀬尾 ひなの";
  h+='<div class="hero" id="top"><div class="wrap"><div class="grid"><div>'+
     '<h1 id="pagetitle">'+esc(nameMain)+'</h1><p class="sub-name" lang="'+(LANG==="ja"?"en":"ja")+'">'+esc(nameSub)+'</p>'+
     '<p class="lead">'+esc(t(C.lead))+'</p>'+
     '<p class="notice">'+esc(t(C.grad).replace(/^\S+\s*/,""))+'</p>'+
     '<div class="btns"><a class="btn fill" href="#research">'+esc(t(C.btns[0][1]))+'</a><a class="btn line" href="#contact">'+esc(LANG==="ja"?"連絡先":"Contact")+'</a></div>'+
     '</div>'+
     '<aside class="profile" aria-labelledby="h-profile"><h2 id="h-profile">'+esc(t(UI.facts))+'</h2><dl>'+
       '<dt>'+esc(t(UI.degree))+'</dt><dd>'+esc(t(UI.degreeV))+'<small>'+esc(t(UI.degreeS))+'</small></dd>'+
       '<dt>'+esc(t(UI.role))+'</dt><dd>'+esc(t(UI.roleV))+'<small>'+esc(t(UI.roleS))+'</small></dd>'+
       '<dt>'+esc(t(UI.sch))+'</dt><dd>'+esc(t(UI.schV))+'</dd>'+
       '<dt>'+esc(t(UI.fields))+'</dt><dd>'+chips(C.tags)+'</dd>'+
     '</dl></aside></div></div></div>';

  /* about */
  var A=C.about;
  h+=sec("about",A.title,
    '<div class="about"><div><div class="focus"><h3>'+esc(t(A.focusLabel))+'</h3><p>'+esc(t(A.focus))+'</p></div>'+
    '<p class="body">'+esc(t(A.p1))+'</p><p class="body">'+esc(t(A.p2))+'</p></div>'+
    '<div class="side"><h3>'+esc(t(A.lang))+'</h3><ul>'+A.langs.map(function(l){return '<li>'+esc(t(l))+'</li>';}).join("")+'</ul>'+
    '<h3>'+esc(t(A.areas))+'</h3><ul>'+A.areasList.map(function(l){return '<li>'+esc(l)+'</li>';}).join("")+'</ul></div></div>');

  /* research */
  var R=C.research;
  h+=sec("research",R.title,'<div class="cards">'+R.items.map(function(x){
    return '<article class="card"><div>'+label(t(x.tag),TONE[x.bar]||"gray")+'</div><h3>'+esc(t(x.t))+'</h3><p class="meta">'+esc(x.m)+'</p><p class="desc">'+esc(t(x.d))+'</p>'+(x.link?'<div><a class="btn line md" href="'+esc(x.link.href)+'" target="_blank" rel="noopener">'+esc(t(x.link.label))+'<span class="ext" aria-hidden="true"></span><span class="sr-only">'+esc(t(UI.ext))+'</span></a></div>':'')+'<p class="foot">'+esc(t(x.f))+'</p></article>';
  }).join("")+'</div>',true);

  /* publications */
  var P=C.pubs;
  h+=sec("publications",P.title,
    P.items.map(function(g){
      return '<div class="pubgroup"><h3>'+esc(t(g.h))+'</h3><ol>'+g.items.map(function(x){
        return '<li><p class="cite" lang="en">'+esc(x.c)+'</p><p class="st">'+label(t(x.s),statusTone(x.s.en))+'</p></li>';
      }).join("")+'</ol></div>';
    }).join("")+
    '<p class="note">'+esc(t(P.note))+'</p>'+
    '<h3 class="subhead" style="font-size:1.5rem;margin-bottom:1rem">'+esc(flat(P.talksTitle))+'</h3><ul class="talks">'+
    P.talks.map(function(x){return '<li class="talk"><div><p class="org">'+esc(t(x.o))+'</p><p class="ttl">'+esc(t(x.t))+'</p>'+(x.link?'<p style="margin-top:.75rem"><a class="btn line md" href="'+esc(x.link.href)+'" target="_blank" rel="noopener">'+esc(t(x.link.label))+'<span class="ext" aria-hidden="true"></span><span class="sr-only">'+esc(t(UI.ext))+'</span></a></p>':'')+'</div><div class="side2"><p>'+esc(x.y)+' · '+esc(t(x.p))+'</p><p style="margin-top:.25rem">'+label(t(x.pill),"gray")+'</p></div></li>';}).join("")+
    '</ul>');

  /* experience */
  var E=C.exp;
  h+=sec("experience",E.title,'<ol class="jobs">'+E.jobs.map(function(j){
    var tone = j.cls==="now" ? "green" : (j.cls==="done" ? "blue" : "gray");
    return '<li><div class="when">'+esc(t(j.w))+'<br>'+label(t(j.tag),tone)+'</div><div><h3>'+esc(t(j.t))+'</h3><p class="meta">'+esc(t(j.m))+'</p><p class="desc">'+esc(t(j.d))+'</p><ul class="bul">'+j.b.map(function(b){return '<li>'+esc(t(b))+'</li>';}).join("")+'</ul></div></li>';
  }).join("")+'</ol>',true);

  /* skills */
  var S=C.skills;
  h+=sec("skills",S.title,'<div class="skillgrid">'+S.groups.map(function(g){
    return '<div class="card"><h3 style="font-size:1.0625rem">'+esc(t(g.h))+'</h3>'+chips(g.l)+'</div>';
  }).join("")+'</div>');

  /* education */
  var D=C.edu;
  h+=sec("education",D.title,'<ol class="edu">'+D.items.map(function(x){
    return '<li><div class="yr">'+esc(t(x.y))+'</div><div><h3>'+esc(t(x.t))+'</h3><p>'+esc(t(x.s))+'</p><p>'+esc(t(x.o))+'</p><p class="meta">'+esc(t(x.x))+'</p>'+(x.g?'<p style="margin-top:.5rem">'+label(t(x.g),"green")+'</p>':'')+'</div></li>';
  }).join("")+'</ol><div class="lic"><h3>'+esc(t(D.licH))+'</h3><ul>'+D.lic.map(function(l){return '<li>'+esc(t(l[0]))+'<span>'+esc(t(l[1]))+'</span></li>';}).join("")+'</ul></div>',true);

  /* awards */
  var W=C.awards;
  h+=sec("awards",W.title,'<div class="cards">'+W.items.map(function(x){
    return '<article class="card"><p class="yr">'+esc(x.y)+' · '+esc(t(x.f))+'</p><h3>'+esc(t(x.t))+'</h3><p class="meta">'+esc(t(x.o))+'</p><p class="desc">'+esc(t(x.d))+'</p>'+(x.link?'<div><a class="btn line md" href="'+esc(x.link.href)+'" target="_blank" rel="noopener">'+esc(t(x.link.label))+'<span class="ext" aria-hidden="true"></span><span class="sr-only">'+esc(t(UI.ext))+'</span></a></div>':'')+'</article>';
  }).join("")+'</div>');

  /* teaching */
  var T=C.teach;
  h+=sec("teaching",T.title,'<div class="cards c3">'+T.items.map(function(x){
    return '<article class="card"><p class="yr">'+esc(x.y)+' · '+esc(t(x.r))+'</p><h3>'+esc(t(x.t))+'</h3><p class="desc">'+esc(t(x.d))+'</p></article>';
  }).join("")+'</div>',true);

  /* contact (incl. CV note) */
  var K=C.contact, V=C.cv;
  h+=sec("contact",K.title,
    '<div class="contactbox"><p>'+esc(t(K.d))+'</p><p>'+esc(t(V.d))+'</p>'+
    '<div class="btns"><a class="btn fill" href="https://www.linkedin.com/in/hinano-seo-962581252" target="_blank" rel="noopener">LinkedIn<span class="sr-only">'+esc(t(UI.ext))+'</span></a></div>'+
    '<ul class="linklist">'+K.links.map(function(l){return '<li><a href="'+l[1]+'" target="_blank" rel="noopener">'+esc(l[0].replace(/^\S+\s/,""))+'<span class="sr-only">'+esc(t(UI.ext))+'</span></a></li>';}).join("")+'</ul>'+
    '<p class="updated">'+esc(V.upd)+'</p></div>');

  document.getElementById("main").innerHTML = h;
  document.getElementById("main").setAttribute("aria-labelledby","pagetitle");
}

document.querySelectorAll(".langswitch button").forEach(function(b){
  b.addEventListener("click",function(){ LANG=b.dataset.l; render(); });
});
render();
})();
</script>
</body>
</html>
